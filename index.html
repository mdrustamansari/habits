<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eef2f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Rustam's Habit Tracker</title>
<style>
:root{
  --bg1:#f4f7fc;--bg2:#e6edf8;--ink:#14202e;--ink2:#5a6a7e;--line:rgba(20,40,70,.12);
  --glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.4);--shadow:0 10px 30px rgba(40,70,120,.12);
  --acc1:#5c9fe6;--acc2:#3560bd;--good:#2fa36b;--bad:#d9534f;--warn:#c9a43a;
  --r:26px;--btn-shadow:0 3px 3px rgba(20,40,80,.16);
}
:root[data-mode=dark]{
  --bg1:#14171c;--bg2:#1b2027;--ink:#eef1f5;--ink2:#9aa6b6;--line:rgba(255,255,255,.12);
  --glass:rgba(60,68,80,.5);--glass2:rgba(60,68,80,.34);--shadow:0 10px 30px rgba(0,0,0,.35);
  --good:#4cc38a;--bad:#ef7773;--btn-shadow:0 3px 3px rgba(0,0,0,.4);
}
:root[data-accent=gold]{--acc1:#f3d36e;--acc2:#c9a43a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden;font-weight:400;letter-spacing:.1px}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;background:radial-gradient(circle,var(--acc1),transparent 70%)}
.blobs i:nth-child(1){width:320px;height:320px;left:-80px;top:-60px}
.blobs i:nth-child(2){width:280px;height:280px;right:-90px;top:42%;opacity:.3}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top) + 14px) 20px 6px;display:flex;align-items:flex-start;justify-content:space-between}
h1{font-size:26px;font-weight:300;margin:0;line-height:1.15}
.ver{font-size:12px;color:var(--ink2);margin-top:3px}
main{flex:1;overflow-y:auto;padding:8px 16px 110px;-webkit-overflow-scrolling:touch}
.card{background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:500;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px;margin:0 0 12px}
.big{font-size:56px;font-weight:200;line-height:1}
.small{font-size:13px;color:var(--ink2)}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.grow{flex:1}
.btn{height:40px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-size:15px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -6px 9px -3px rgba(255,255,255,.4),var(--btn-shadow);transition:transform .25s ease,opacity .25s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-weight:600;border-color:transparent}
:root[data-accent=gold] .btn.primary{color:#3a2c00}
.btn.out{background:transparent;box-shadow:none}
.btn.sm{height:28px;padding:0 12px;font-size:13px}
.btn.big2{height:64px;font-size:18px;flex:1;border-radius:32px}
.btn.good{background:linear-gradient(135deg,#46c58a,#2a9163);color:#fff;font-weight:600;border-color:transparent}
.btn.round{width:32px;height:32px;padding:0;border-radius:50%}
.btn.del{color:var(--bad)}
.btn svg,.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom) + 12px)}
nav div{display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;max-width:400px}
nav button{flex:1;height:44px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font:inherit;font-size:14px;cursor:pointer;transition:all .4s ease}
nav button.on{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff}
:root[data-accent=gold] nav button.on{color:#3a2c00}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--glass2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc1),var(--acc2));transition:width 1s ease}
.bar.g i{background:linear-gradient(90deg,#46c58a,#2a9163)}
.bar.r i{background:linear-gradient(90deg,#f09a97,#d9534f)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--glass2);width:max-content}
.seg button{height:32px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font:inherit;cursor:pointer;transition:all .4s}
.seg button.on{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff}
.wk{display:flex;align-items:stretch;gap:8px;height:130px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;font-size:11px;color:var(--ink2)}
.wk b{display:block;width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--acc1),var(--acc2));min-height:4px;transition:height 1s ease}
.wk b.neg{background:linear-gradient(180deg,#f09a97,#d9534f)}
.wk b.zero{background:var(--line)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid7 span{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid var(--line);background:var(--glass2);color:var(--ink2)}
.grid7 .h{border:0;background:none;aspect-ratio:auto;font-size:11px}
.grid7 .p1{background:rgba(70,197,138,.25);color:var(--ink)}.grid7 .p2{background:rgba(70,197,138,.5);color:var(--ink)}.grid7 .p3{background:rgba(42,145,99,.85);color:#fff}
.grid7 .n1{background:rgba(217,83,79,.28);color:var(--ink)}
.grid7 .today{outline:2px solid var(--acc2)}
.hrs{display:flex;align-items:flex-end;gap:3px;height:90px}
.hrs div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.hrs i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--bad);opacity:.75;min-height:0}
.hrs u{display:block;width:100%;border-radius:2px;background:var(--good);opacity:.7;min-height:0;text-decoration:none}
.lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:6px}
.log{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.log:first-of-type{border-top:0}
.pts{font-weight:500;min-width:36px;text-align:right}
.pos{color:var(--good)}.neg{color:var(--bad)}
.tri{font-size:11px}
details summary{list-style:none;cursor:pointer;color:var(--ink2);font-size:13px}
details summary::-webkit-details-marker{display:none}
.field{width:100%;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font:inherit;padding:0 16px;outline:none}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);border:0;cursor:pointer;flex:none;transition:background .4s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .4s}
.sw.on{background:linear-gradient(135deg,var(--acc1),var(--acc2))}.sw.on i{transform:translateX(20px)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:34px;text-align:center;font-weight:400;font-size:20px}
/* sheets */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,20,40,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .5s ease}
.sheet{width:100%;max-width:560px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);border:1px solid var(--line);border-radius:34px 34px 0 0;padding:24px 22px calc(env(safe-area-inset-bottom) + 24px);animation:up .6s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto}
:root[data-mode=dark] .sheet{background:rgba(32,37,45,.9)}
:root:not([data-mode=dark]) .sheet{background:rgba(250,252,255,.88)}
.sheet h3{font-size:24px;font-weight:300;margin:0 0 8px}
.sheet p{color:var(--ink2);line-height:1.5;margin:6px 0 14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
/* companion */
#orb{width:44px;height:44px;border-radius:50%;flex:none;cursor:pointer;background:radial-gradient(circle at 32% 28%,#fff8e0,#f3d36e 38%,#4fc3b5 78%,#2c8f96);
  box-shadow:0 6px 16px rgba(60,150,150,.35),inset 0 -4px 8px rgba(255,255,255,.35);animation:float 6s ease-in-out infinite;position:relative}
#orb:before,#orb:after{content:"";position:absolute;top:19px;width:4px;height:4px;border-radius:50%;background:rgba(20,40,50,.7)}
#orb:before{left:14px}#orb:after{right:14px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#say{position:fixed;top:calc(env(safe-area-inset-top) + 66px);right:16px;left:60px;max-width:360px;margin-left:auto;z-index:8;padding:12px 16px;border-radius:20px;
  background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:var(--shadow);font-size:14px;line-height:1.45;
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:all .8s ease}
#say.on{opacity:1;transform:none}
/* breathing */
.breath{width:190px;height:190px;border-radius:50%;margin:18px auto;background:radial-gradient(circle at 35% 30%,#fff8e0,#7fd6c9 60%,#3a9ca3);box-shadow:0 0 50px rgba(79,195,181,.5);animation:br 10s ease-in-out infinite;display:flex;align-items:center;justify-content:center;color:#103a40;font-size:18px}
@keyframes br{0%{transform:scale(.6)}40%{transform:scale(1)}100%{transform:scale(.6)}}
/* lock */
#lock{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--bg1),var(--bg2));display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
#lock.on{display:flex}
.dots{display:flex;gap:14px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink2);transition:all .3s}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-size:26px;font-weight:300;cursor:pointer}
.pad button:active{background:var(--glass2)}
#cover{position:fixed;inset:0;z-index:60;background:var(--bg1);display:none}
body.cover #cover{display:block}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blobs"><i></i><i></i></div>
<div id="app">
  <header>
    <div><h1>Rustam's<br>Habit Tracker</h1><div class="ver">Version 1.0</div></div>
    <div id="orb" title="Tap me" aria-label="Companion"></div>
  </header>
  <main id="main"></main>
</div>
<div id="say" role="status"></div>
<nav><div id="tabs"></div></nav>
<div id="ov"></div>
<div id="lock"><div id="lt" style="font-size:22px;font-weight:300"></div><div class="dots" id="ld"></div><div class="pad" id="lp"></div><div class="small" id="lm"></div></div>
<div id="cover"></div>

<script>
(function(){
'use strict';
var KEY='rht.v1', VERSION='1.0';
function defaults(){return{name:'',accent:'sapphire',theme:'auto',pin:null,salt:Math.random().toString(36).slice(2),lockAfter:15,
  yv:1,goal:20,target:120,logs:[],ul:[],ideas:[],done:false,sound:true,vib:true,said:0}}
var S=load();
function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');return Object.assign(defaults(),o)}catch(e){return defaults()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(s){return document.querySelector(s)};
var tab='today', pTab='week', monthOff=0;
var IC={
 trash:'<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>',
 lock:'<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>',
 wind:'<svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 10-3-3M3 12h16a3 3 0 11-3 3M3 16h8"/></svg>',
 shield:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 down:'<svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>',
 flame:'<svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>',
 phone:'<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3"/><path d="M11 18h2"/></svg>',
 left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>'
};
/* ---------- dates ---------- */
function pad(n){return n<10?'0'+n:''+n}
function dk(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return dk(Date.now())}
function fromKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(k,n){var d=fromKey(k);d.setDate(d.getDate()+n);return dk(d)}
function weekStart(k){var d=fromKey(k);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dk(d)}
function hm(t){var d=new Date(t),h=d.getHours(),m=d.getMinutes(),a=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(m)+' '+a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* ---------- scoring ---------- */
function dv(){return S.yv*2}
function build(){
  var I={};
  function g(k){return I[k]||(I[k]={d:0,y:0,m:0,hasUl:false})}
  S.logs.forEach(function(l){var o=g(dk(l.t));if(l.k==='d')o.d++;else o.y++});
  S.ul.forEach(function(u){var o=g(dk(u.t));o.m+=u.m;o.hasUl=true});
  return I;
}
function ulScore(o){if(!o||!o.hasUl)return 0;var r=(S.target-o.m)/S.target;return Math.round(Math.max(0,Math.min(1,r))*10)}
function score(o){if(!o)return 0;return o.d*dv()-o.y*S.yv+ulScore(o)}
function stats(){
  var I=build(),keys=Object.keys(I).sort(),total=0,best=0,bestK='',D=0,Y=0;
  keys.forEach(function(k){var s=score(I[k]);total+=Math.max(0,s);if(s>best){best=s;bestK=k}D+=I[k].d;Y+=I[k].y});
  var streak=0,k=today();if(!(I[k]&&score(I[k])>0))k=addDays(k,-1);
  while(I[k]&&score(I[k])>0){streak++;k=addDays(k,-1)}
  var clear=keys.filter(function(k){return I[k].d>0&&I[k].y===0}).length;
  var lvl=Math.floor(Math.sqrt(total/12))+1, cur=Math.pow(lvl-1,2)*12, nxt=Math.pow(lvl,2)*12;
  return{I:I,total:total,best:best,bestK:bestK,D:D,Y:Y,streak:streak,clear:clear,lvl:lvl,prog:(total-cur)/(nxt-cur),toNext:Math.ceil(nxt-total)};
}
var LVL=['Seed','Sprout','Sapling','Young tree','Strong tree','Oak','Forest','Mountain','Sky','Star'];
function lvlName(n){return LVL[Math.min(n-1,LVL.length-1)]}
function weekTotals(k){var I=build(),s=weekStart(k),out=[];for(var i=0;i<7;i++){var d=addDays(s,i);out.push({k:d,o:I[d]})}return out}
/* ---------- companion ---------- */
var sayT;
function say(t){var e=$('#say');e.textContent=t;e.classList.add('on');clearTimeout(sayT);sayT=setTimeout(function(){e.classList.remove('on')},5200)}
var KIND_D=['Well done. You rode out that urge.','Strong. Each time you resist, the habit gets weaker.','That was a real win. Keep going.','You chose yourself just now. Good.'];
var KIND_Y=['It happened. It does not define you. Reset and go again.','One slip is just one slip. The next choice is yours.','Be kind to yourself. Shame feeds the habit, calm starves it.','Done is done. Breathe, then change the room you are in.'];
var TIPS=['Stand up and leave the room you are in.','Wash your face and drink a glass of water.','Put your phone outside the bedroom tonight.','Do 20 slow squats or push-ups.','Step outside for five minutes.','Message a friend or call a family member.','Open a book and read one page aloud.'];
var IDLE=['Hard hours are coming. Keep your phone away from your bed.','Small wins add up to a strong character.','An urge is like a wave. It rises, peaks and falls.','You do not need to win the day, only the next ten minutes.'];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
/* ---------- feedback ---------- */
var AC;
function tone(f,d,v){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.value=0;
 o.connect(g);g.connect(AC.destination);var t=AC.currentTime;g.gain.linearRampToValueAtTime(v||.08,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05)}catch(e){}}
function vib(p){if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
/* ---------- actions ---------- */
var undoT;
function toastUndo(msg,fn){
  var e=$('#say');e.innerHTML=esc(msg)+' <button class="btn sm out" id="undo" style="margin-left:6px">Undo</button>';e.style.pointerEvents='auto';e.classList.add('on');
  $('#undo').onclick=function(){fn();e.classList.remove('on');e.style.pointerEvents='none';render()};
  clearTimeout(sayT);clearTimeout(undoT);undoT=setTimeout(function(){e.classList.remove('on');e.style.pointerEvents='none'},6000);
}
function logHab(k,rescue){
  var l={id:Date.now()+Math.random(),t:Date.now(),k:k};if(rescue)l.r=1;S.logs.push(l);save();
  if(k==='d'){tone(660,.35);setTimeout(function(){tone(880,.4)},140);vib(18);render();say(pick(KIND_D)+' +'+dv())}
  else{tone(300,.5,.06);vib([30,60,30]);render();yieldSheet()}
}
function yieldSheet(){
  var h=new Date().getHours(),late=(h>=16||h<5);
  sheet('<h3>It happened</h3><p>'+esc(pick(KIND_Y))+'</p><div class="card" style="margin:0 0 14px"><div class="small">Try this now</div><div style="margin-top:6px;font-size:17px">'+esc(pick(TIPS))+'</div></div>'+
   (late?'<p>Evenings and nights are the hardest hours. Charge your phone away from your bed tonight.</p>':'')+
   '<div class="row"><button class="btn primary grow" id="y1">'+IC.wind+'Start Urge Rescue</button><button class="btn out" id="y2">Close</button></div>');
  $('#y1').onclick=function(){close();rescue()};$('#y2').onclick=close;
}
function delLog(id){
  var i=S.logs.findIndex(function(l){return l.id===id});if(i<0)return;var rm=S.logs.splice(i,1)[0];save();render();
  toastUndo('Entry removed.',function(){S.logs.push(rm);save()});
}
function addUl(m){S.ul.push({id:Date.now()+Math.random(),t:Date.now(),m:m});save();tone(520,.3);vib(12);render();

      var lo={yv:1,goal:5,target:15,lockAfter:0}[k],hi={yv:5,goal:200,target:600,lockAfter:300}[k];S[k]=Math.max(lo,Math.min(hi,S[k]+d*stp));save();render()}});

}
function exportData(){
  var blob=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a'),f='habit-tracker-backup-'+today()+'.json';
  var file;try{file=new File([blob],f,{type:'application/json'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Habit Tracker backup'}).catch(function(){})}
  else{a.href=URL.createObjectURL(blob);a.download=f;document.body.appendChild(a);a.click();a.remove()}
}
function importData(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.logs))throw 0;
  ask('Replace current data with this backup?','Replace',function(){S=Object.assign(defaults(),o);save();apply();render();say('Backup restored.')})}catch(x){say('That file is not a valid backup.')}};r.readAsText(f)}
/* ---------- theme ---------- */
var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function apply(){
  var dark=S.theme==='dark'||(S.theme==='auto'&&mq&&mq.matches),r=document.documentElement;
  r.setAttribute('data-mode',dark?'dark':'light');r.setAttribute('data-accent',S.accent);
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#14171c':'#eef2f8';
}
if(mq&&mq.addEventListener)mq.addEventListener('change',function(){apply()});
